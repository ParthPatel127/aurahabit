<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="#090D16" />

  <!-- Outer Ring with Gradient -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#auraGlow)" stroke-width="28" filter="url(#glow)" opacity="0.9" />

  <!-- Inner Checkmark & Star Motif -->
  <path d="M 180 260 L 230 310 L 330 190 M 310 190 L 330 160 L 350 190 L 380 200 L 355 220 L 365 250 L 330 230 L 295 250 L 305 220 L 280 200 Z" 
        fill="none" 
        stroke="url(#auraGlow)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
