<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle matching Chrome shortcut button background -->
  <circle cx="256" cy="256" r="256" fill="#090D16" />

  <!-- Glowing Checkmark and Shooting Star Motif -->
  <g filter="url(#glowEffect)">
    <path d="M 120 280 L 205 365 L 340 180" fill="none" stroke="url(#auraGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="340,110 358,155 405,158 368,188 380,234 340,205 300,234 312,188 275,158 322,155" fill="url(#auraGrad)" />
  </g>
</svg>
